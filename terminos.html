<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Términos y condiciones – SorteoYa</title>
<link rel="icon" href="logo.png">
<style>
:root{--navy:#010f39;--navy2:#0b1f66;--gold:#fdba0a;--gold2:#ff9d00;--bg:#f3f5fb;--txt:#0d1330;--mut:#667091}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
a{color:inherit;text-decoration:none}
header{background:var(--navy);box-shadow:0 2px 12px #0006}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;max-width:1000px;margin:auto}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800}
.brand img{width:42px;height:42px;border-radius:10px}
.back{background:var(--gold);color:var(--navy);padding:9px 16px;border-radius:99px;font-weight:800;font-size:.9rem}
.hero{background:radial-gradient(circle at 70% 0,var(--navy2),var(--navy) 70%);color:#fff;text-align:center;padding:30px 16px 48px}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900}.hero h1 b{color:var(--gold)}
main{max-width:820px;margin:-26px auto 40px;padding:0 16px}
.doc{background:#fff;border-radius:22px;padding:24px 22px;box-shadow:0 8px 30px #0b1f6622}
h2{font-size:1.15rem;font-weight:900;margin:26px 0 8px;color:var(--navy2);padding-bottom:6px;border-bottom:3px solid var(--gold)}
h2:first-child{margin-top:0}
p,li{font-size:.95rem;margin:8px 0}
ul{padding-left:20px}
b.k{color:var(--navy)}
.prem li{margin:5px 0}
footer{background:var(--navy);color:#ffffffb0;text-align:center;padding:26px 16px;font-size:.85rem}
footer img{width:60px;border-radius:12px;margin-bottom:6px}
footer a{color:var(--gold);font-weight:700;text-decoration:underline}
.flinks{margin:6px 0 10px}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="index.html"><img src="logo.png" alt="SorteoYa"><span>SorteoYa</span></a>
  <a class="back" href="index.html">← Volver al inicio</a>
</div></header>
<div class="hero"><h1>Términos y <b>condiciones</b></h1><p>Lee con atención antes de participar</p></div>
<main><div class="doc" id="doc"></div></main>
<footer>
  <img src="logo.png" alt="SorteoYa"><br>
  <div class="flinks"><a href="terminos.html">Términos y condiciones</a> · <a href="index.html">Inicio</a></div>
  © 2026 SorteoYa · Sorteo válido para mayores de 18 años. Juega con responsabilidad.
</footer>
<script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>')</script>
<script>
const s=SORTEOS[0];
const total=s.hasta-s.desde+1;
const tar=(s.tarifas||[{cant:1,precio:s.precio}]);
const money=n=>"S/ "+Number(n).toFixed(2);
const cap=t=>t.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const todos=[...(s.premios||[]),...(s.otros||[])];
const prem=todos.map((p,k)=>`<li><b class="k">${k+1}° ${p.tag?cap(p.tag):"Premio"}:</b> ${p.n}</li>`).join("");
const tarif=tar.map(x=>`<li>${x.cant} boleto${x.cant>1?"s":""} = ${money(x.precio)}</li>`).join("");
document.getElementById("doc").innerHTML=`
<h2>1. Participación, requisitos y emisión de boletos</h2>
<p><b class="k">Requisitos obligatorios:</b> para participar en el sorteo, el usuario debe ser mayor de edad y contar obligatoriamente con una cuenta bancaria propia (a su nombre) para la recepción de cualquier premio en efectivo.</p>
<p><b class="k">Emisión total:</b> el sorteo cuenta con un total de <b>${total} boletos numerados</b>.</p>
<p><b class="k">Costo por boleto y promociones:</b></p>
<ul>${tarif}</ul>
<p><b class="k">Dinámica de compra:</b> el participante ingresa a la página web, elige de manera libre su número de boleto y realiza la selección, lo cual lo direccionará automáticamente a WhatsApp. Por ese medio enviará su comprobante de pago y registrará sus nombres y apellidos para completar la compra.</p>
<p><b class="k">Verificación:</b> el participante podrá verificar sus nombres y boletos adquiridos directamente en la página web. En caso de tener dudas o consultas, puede escribir al área de soporte para recibir asistencia inmediata.</p>

<h2>2. Restricciones de participación</h2>
<p><b class="k">Prohibición:</b> no pueden participar el organizador del sorteo ni sus familiares directos (padres, abuelos, hermanos y pareja o cónyuge).</p>

<h2>3. Plan de premios oficiales</h2>
<p>El sorteo cuenta con múltiples premios independientes. Cada boleto tiene la oportunidad de ganar y, si se adquieren varios, los premios se pueden acumular:</p>
<ul class="prem">${prem}</ul>

<h2>4. Fecha del sorteo</h2>
<p><b class="k">Sin fecha fija:</b> el sorteo no tiene una fecha programada de manera anticipada. Se llevará a cabo únicamente una vez que se hayan vendido el 100% de los boletos emitidos.</p>
<p><b class="k">Transmisión:</b> el sorteo se realizará de forma totalmente transparente y EN VIVO a través de la página oficial de Facebook de SorteoYa.</p>

<h2>5. Reglas especiales: premio consuelo (mayor comprador)</h2>
<p><b class="k">Definición:</b> se otorgará un premio consuelo de S/ 200.00 en efectivo a la persona que haya acumulado la mayor cantidad de tickets comprados y que no haya resultado ganadora de ningún otro premio principal (ni en efectivo ni electrodoméstico).</p>
<p><b class="k">Criterio de exclusión:</b> si el participante con más tickets ya ganó algún premio en el sorteo, la opción pasará automáticamente al siguiente participante con mayor cantidad de tickets válidos que siga sin ganar nada.</p>
<p><b class="k">En caso de empate:</b> si se registra un empate entre dos o más participantes que cumplan con la mayor cantidad de tickets y cero premios, se realizará un mini sorteo en vivo entre ellos para definir de forma aleatoria al único ganador de los S/ 200.00.</p>

<h2>6. Validación e identificación de ganadores</h2>
<p><b class="k">Identificación obligatoria:</b> cada ganador deberá identificarse obligatoriamente presentando una foto de su DNI para comprobar que es la persona premiada y mayor de edad.</p>
<p><b class="k">Plazo de reclamo:</b> el plazo máximo para que los ganadores se pongan en contacto con el organizador de SorteoYa será de un máximo de 72 horas (3 días hábiles) después de realizado el sorteo. Vencido este plazo, no se aceptarán reclamos.</p>

<h2>7. Entrega de premios</h2>
<p><b class="k">Premios en efectivo (incluyendo el premio consuelo):</b> serán entregados exclusivamente mediante transferencia bancaria a una cuenta que esté obligatoriamente a nombre del titular registrado como ganador.</p>
<p><b class="k">Premios físicos (electrodomésticos):</b></p>
<ul>
<li><b class="k">Para ganadores en Lima:</b> podrán acercarse a recoger su premio directamente a la vivienda del organizador para llevárselo, o bien solicitar un envío mediante cargo.</li>
<li><b class="k">Para ganadores en provincia:</b> los premios se enviarán a través de la agencia de transportes Shalom hacia la dirección proporcionada por el titular. El costo del envío será asumido en su totalidad por el ganador (titular). SorteoYa y el organizador no se hacen responsables por maltratos, pérdidas o inconvenientes que puedan ocurrir durante el trayecto por parte de la agencia de envíos.</li>
<li><b class="k">Condición de envío:</b> todo envío de premios físicos se realizará única y exclusivamente a nombre del titular registrado en el sorteo.</li>
</ul>`;
</script>
</body>
</html>
