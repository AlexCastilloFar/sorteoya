body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}

<script>
const $=id=>document.getElementById(id);
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const pad=n=>String(n).padStart(2,"0");
let filas=[];

function parseCSV(t){const o=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);o.push(r);r=[];c=""}else c+=ch}
  if(c||r.length){r.push(c);o.push(r)}return o}

function ocupados(s){const m=new Map();
  filas.filter(f=>norm(f.dina).includes(norm(s.clave))).forEach(f=>f.nums.forEach(n=>m.set(n,f.nombre)));return m}

// Nombres abreviados: "Alex Cas." (nombre + 3 letras del primer apellido). Nunca se muestra el DNI.
const PARTICULAS=new Set(["de","del","la","las","los","y","san","santa"]);
function abreviar(nombre){
  const t=nombre.trim().split(/\s+/).filter(Boolean);if(!t.length)return "";
  const bon=w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  const u=t.filter((x,i)=>i===0||!PARTICULAS.has(norm(x)));            // sin "de", "del", "la"...
  const ap=u.length>=4?u[u.length-2]:(u[1]||"");                          // 4+ palabras: nombres compuestos + 2 apellidos → 1.er apellido
  if(!ap)return bon(t[0]);
  return bon(t[0])+" "+(ap.length<=3?bon(ap):bon(ap.slice(0,3))+".");
}

// Se muestra sola cuando la dinámica se agota, o cuando en config.js se pone mostrarLista:true en esa dinámica.
function pintarLista(){
  const cont=$("listas");cont.innerHTML="";
  SORTEOS.forEach(s=>{
    const oc=ocupados(s),total=s.hasta-s.desde+1,abierta=oc.size>=total||s.mostrarLista===true;
    const panel=document.createElement("div");panel.className="card";
    const h=document.createElement("div");h.className="lhead";
    const t=document.createElement("div");t.textContent="📋 "+s.titulo;
    const c=document.createElement("span");c.textContent=oc.size+" de "+total+" números vendidos";
    h.append(t,c);panel.appendChild(h);
    if(!abierta){
      const k=document.createElement("div");k.className="lock";
      k.innerHTML="<b>🔒 Lista aún no disponible</b>En este momento no se muestran los nombres. Se mostrarán al completar la venta de todos los boletos, o cuando el organizador decida publicarla.";
      const sm=document.createElement("small");sm.textContent="Mientras tanto, puedes ver tus números en \"Mis tickets\" de la página principal.";k.appendChild(sm);
      const a=document.createElement("a");a.className="cta";a.href="index.html#tickets";a.textContent="Buscar mis números →";
      const w=document.createElement("div");w.style.textAlign="center";w.append(a);k.appendChild(w);
      panel.appendChild(k);
    }else{
      const box=document.createElement("div");box.className="lbox";
      [...oc.entries()].sort((a,b)=>a[0]-b[0]).forEach(([n,nom])=>{
        const d=document.createElement("div");d.className="li";
        const b=document.createElement("b");b.textContent=pad(n);
        const sp=document.createElement("span");sp.textContent=abreviar(nom);
        d.append(b,sp);box.appendChild(d)});
      panel.appendChild(box);
      const nt=document.createElement("p");nt.className="nota";nt.textContent="Por privacidad, los nombres se muestran abreviados y nunca se publica el DNI. Esta lista se actualiza sola.";panel.appendChild(nt);
    }
    cont.appendChild(panel);
  });
}

async function cargar(){
  try{
    const r=await fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"t="+Date.now());
    filas=parseCSV(await r.text()).slice(1).filter(f=>f[0]&&f[1]).map(f=>({dina:f[0].trim(),nombre:f[1].trim(),nums:(f[2]||"").match(/\d+/g)?.map(n=>parseInt(n,10))||[]}));
  }catch(e){}
  pintarLista();
}
pintarLista();cargar();setInterval(cargar,60000);
</script>
